<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>經緯與時區地球儀</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>if(!window.d3)document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"><\/script>');</script>
<style>
  :root{
    --void:#050d14;
    --deep:#0a1a25;
    --panel:#0e2230;
    --line:#1d3d50;
    --sea:#123a4a;
    --sea-fill:#0f2f42;
    --land:#e7ddc7;
    --brass:#d8a94f;
    --brass-dim:rgba(216,169,79,.30);
    --ink:#dce8ee;
    --muted:#7f9aa8;
    --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",ui-sans-serif,system-ui,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti TC",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 700px at 30% -10%, #0d2436 0%, transparent 60%),
      var(--void);
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 48px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:26px;
    letter-spacing:.06em;
    margin:0;
    color:var(--brass);
  }
  header p{margin:0;color:var(--muted);font-size:13.5px;max-width:52ch}

  .stage{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:22px;align-items:start}
  @media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}}

  .globe-box{
    position:relative;
    border:1px solid var(--line);
    border-radius:2px;
    background:linear-gradient(180deg,#081824,#050e15);
    overflow:hidden;
  }
  canvas{display:block;width:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  canvas:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}

  .readout{
    position:absolute;left:12px;top:11px;
    font-family:var(--serif);
    font-size:13px;color:var(--brass);
    letter-spacing:.04em;
    text-shadow:0 1px 6px #000;
    pointer-events:none;
  }
  .clock{
    position:absolute;left:12px;bottom:11px;
    font-family:var(--serif);font-size:13px;color:var(--ink);
    text-shadow:0 1px 6px #000;pointer-events:none;
  }
  .clock b{color:var(--brass);font-weight:400}
  .hintbar{
    position:absolute;right:12px;bottom:11px;
    font-size:11.5px;color:var(--muted);text-shadow:0 1px 6px #000;pointer-events:none;
  }

  .panel{border:1px solid var(--line);border-radius:2px;background:var(--panel);padding:14px 15px}
  .panel + .panel{margin-top:14px}
  .panel h2{
    font-family:var(--serif);font-weight:400;font-size:15px;letter-spacing:.05em;
    margin:0 0 10px;color:var(--brass);
  }
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0}
  .row label{color:var(--ink);font-size:13.5px}
  .sub{color:var(--muted);font-size:12px;margin:-4px 0 10px}

  select,button{
    font-family:var(--sans);font-size:13px;color:var(--ink);
    background:#0a1a25;border:1px solid var(--line);border-radius:2px;padding:5px 8px;
  }
  select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
  button{cursor:pointer}
  button:hover{border-color:var(--brass);color:var(--brass)}
  .btns{display:flex;gap:8px;margin-top:12px}
  .btns button{flex:1}

  input[type=range]{width:126px;accent-color:var(--brass);background:transparent}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--brass)}

  .pin{
    border-top:1px solid var(--line);margin-top:12px;padding-top:11px;
    font-size:13px;color:var(--muted);
  }
  .pin .big{font-family:var(--serif);font-size:19px;color:var(--ink);display:block;letter-spacing:.03em}
  .pin .zone{color:var(--brass)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:3.5px 0;color:var(--ink)}
  td.t{text-align:right;font-family:var(--serif);letter-spacing:.03em;color:var(--brass)}
  td.o{text-align:right;color:var(--muted);font-size:11.5px;width:52px}

  footer{margin-top:26px;color:var(--muted);font-size:12px;line-height:1.7}
  footer b{color:var(--ink);font-weight:400}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>經緯與時區地球儀</h1>
    <p>拖曳轉動地球，滾輪縮放。點任一處可讀出經緯度與該地標準時間。</p>
  </header>

  <div class="stage">
    <div class="globe-box">
      <canvas id="c" tabindex="0" aria-label="可旋轉的地球儀，顯示經緯線與時區"></canvas>
      <div class="readout" id="readout"></div>
      <div class="clock" id="clock"></div>
      <div class="hintbar">拖曳旋轉 · 滾輪縮放 · 方向鍵微調</div>
    </div>

    <div>
      <div class="panel">
        <h2>旋轉</h2>
        <div class="row">
          <label for="spin">自動旋轉</label>
          <input type="checkbox" id="spin" checked>
        </div>
        <div class="row">
          <label for="speed">速度</label>
          <input type="range" id="speed" min="1" max="40" value="8">
        </div>
        <div class="row">
          <label for="dir">方向</label>
          <select id="dir">
            <option value="1">由西向東（地球實際方向）</option>
            <option value="-1">由東向西</option>
          </select>
        </div>
        <div class="btns">
          <button id="reset">回正視角</button>
          <button id="taipei">飛到台北</button>
        </div>
      </div>

      <div class="panel">
        <h2>圖層</h2>
        <div class="row">
          <label for="grid">經緯線間距</label>
          <select id="grid">
            <option value="0">不顯示</option>
            <option value="5">5°</option>
            <option value="10" selected>10°</option>
            <option value="15">15°（＝1 小時）</option>
            <option value="30">30°</option>
          </select>
        </div>
        <div class="row">
          <label for="gridlab">經緯度標籤</label>
          <input type="checkbox" id="gridlab" checked>
        </div>
        <div class="row">
          <label for="tzmode">時區</label>
          <select id="tzmode">
            <option value="real" selected>實際時區界線</option>
            <option value="ideal">理想 15° 時區帶</option>
            <option value="off">不顯示</option>
          </select>
        </div>
        <div class="row">
          <label for="tzlab">時區標籤</label>
          <input type="checkbox" id="tzlab" checked>
        </div>
        <div class="row">
          <label for="borders">國界</label>
          <input type="checkbox" id="borders" checked>
        </div>
        <div class="row">
          <label for="citymark">城市地標</label>
          <input type="checkbox" id="citymark" checked>
        </div>
        <div class="row">
          <label for="climate">氣候帶標示</label>
          <input type="checkbox" id="climate" checked>
        </div>
        <div class="row">
          <label for="night">晝夜線</label>
          <input type="checkbox" id="night" checked>
        </div>
        <div class="row">
          <label for="hour">UTC 時刻</label>
          <input type="range" id="hour" min="0" max="1439" value="0">
        </div>
        <p class="sub" id="hourlab">跟著現在時間走</p>
        <button id="nowbtn" style="width:100%">回到現在</button>

        <div class="pin" id="pin">
          <span class="big">尚未選點</span>
          點地球上任一位置查看該地經緯度與時間
        </div>
      </div>

      <div class="panel">
        <h2>各地此刻</h2>
        <table id="cities"></table>
      </div>
    </div>
  </div>

  <footer>
    <b>關於資料：</b>時區界線與海岸線來自 Natural Earth 公眾領域資料，已為球面繪製簡化。地球儀上的時區標示為<b>標準時間偏移</b>，未套用日光節約時間；右側「各地此刻」則是各城市的實際現行時間。
  </footer>
</div>

/* ---------- 資料整理 ---------- */
function toFeatures(arr){
  return arr.map(f => ({
    type:"Feature",
    properties:{v:f.p},
    geometry:{type:"MultiPolygon", coordinates:f.g}
  }));
}
// 統一環繞方向：球面多邊形若「大於半球」代表方向相反，需反轉
function fixWinding(feat){
  feat.geometry.coordinates = feat.geometry.coordinates.map(poly=>{
    const area = d3.geoArea({type:"Polygon", coordinates:[poly[0]]});
    return area > 2*Math.PI ? poly.map(r => r.slice().reverse()) : poly;
  });
  return feat;
}
const land = toFeatures(LAND).map(fixWinding);
const tz   = toFeatures(TZ).map(fixWinding);
const co   = toFeatures(CO).map(fixWinding);
tz.forEach(f=>{ f.properties.c = d3.geoCentroid(f); f.properties.a = d3.geoArea(f); });

/* 理想 15° 時區帶 */
const idealZones = d3.range(-12,12).map(z=>{
  const a = z*15 - 7.5, b = z*15 + 7.5, ring=[];
  for(let lat=-90; lat<=90; lat+=5) ring.push([a,lat]);
  for(let lat=90; lat>=-90; lat-=5) ring.push([b,lat]);
  ring.push([a,-90]);
  let poly=[ring];
  if(d3.geoArea({type:"Polygon",coordinates:poly}) > 2*Math.PI) poly=[ring.slice().reverse()];
  return {type:"Feature", properties:{v:z, c:[z*15,0], a:1},
          geometry:{type:"Polygon", coordinates:poly}};
});

function zoneColor(z, alpha){
  const hue = (z*15 + 205 + 360) % 360;
  const light = (Math.round(z) % 2 === 0) ? 58 : 44;
  return `hsla(${hue},42%,${light}%,${alpha})`;
}
function offsetText(z){
  const s = z<0 ? "−" : "+";
  const h = Math.floor(Math.abs(z));
  const m = Math.round((Math.abs(z)-h)*60);
  return "UTC" + s + String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
}

/* ---------- 畫面設定 ---------- */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const projection = d3.geoOrthographic().clipAngle(90).precision(0.4);
const path = d3.geoPath(projection, ctx);
const graticule = d3.geoGraticule();

let rot = [-121, -24];          // 起始：東亞面向觀者
let zoom = 1, baseScale = 300;
let W = 0, H = 0, dpr = 1;

const ui = {};
["spin","speed","dir","grid","gridlab","tzmode","tzlab","borders","night","hour","citymark","climate"]
  .forEach(id => ui[id] = document.getElementById(id));

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduceMotion) ui.spin.checked = false;

let manualTime = null;          // null = 跟著真實時間
let picked = null;              // 使用者點選的位置

function resize(){
  const box = canvas.parentElement.getBoundingClientRect();
  W = Math.max(280, box.width);
  H = Math.max(320, Math.min(W * 0.78, 620));
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.height = H + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  baseScale = Math.min(W, H)/2 - 14;
  draw();
}
window.addEventListener("resize", resize);

/* ---------- 太陽位置（晝夜線） ---------- */
function currentDate(){
  if(manualTime === null) return new Date();
  const d = new Date();
  const mins = manualTime;
  return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(),
                           Math.floor(mins/60), mins%60));
}
function subsolar(date){
  const start = Date.UTC(date.getUTCFullYear(),0,1);
  const day = (date - start)/86400000;
  const hours = date.getUTCHours() + date.getUTCMinutes()/60 + date.getUTCSeconds()/3600;
  const g = 2*Math.PI/365 * (day + (hours-12)/24);
  const eq = 229.18*(0.000075 + 0.001868*Math.cos(g) - 0.032077*Math.sin(g)
            - 0.014615*Math.cos(2*g) - 0.040849*Math.sin(2*g));
  const dec = 0.006918 - 0.399912*Math.cos(g) + 0.070257*Math.sin(g)
            - 0.006758*Math.cos(2*g) + 0.000907*Math.sin(2*g)
            - 0.002697*Math.cos(3*g) + 0.001480*Math.sin(3*g);
  const lon = -15*(hours + eq/60 - 12);
  return [((lon+540)%360)-180, dec*180/Math.PI];
}

/* ---------- 繪圖 ---------- */
function centerPoint(){ return [-rot[0], -rot[1]]; }
function isVisible(p){ return d3.geoDistance(p, centerPoint()) < Math.PI/2 - 0.03; }

function fill(feature, color){
  ctx.beginPath(); path(feature); ctx.fillStyle = color; ctx.fill();
}
function stroke(obj, color, width, dash){
  ctx.beginPath(); path(obj);
  ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]);
}

function draw(){
  projection.scale(baseScale*zoom).translate([W/2,H/2]).rotate([rot[0],rot[1],0]);
  ctx.clearRect(0,0,W,H);

  const cx = W/2, cy = H/2, r = baseScale*zoom;

  // 大氣暈
  const glow = ctx.createRadialGradient(cx,cy,r*0.92, cx,cy,r*1.16);
  glow.addColorStop(0,"rgba(90,160,190,.16)");
  glow.addColorStop(1,"rgba(90,160,190,0)");
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx,cy,r*1.16,0,2*Math.PI); ctx.fill();

  // 海洋
  fill({type:"Sphere"}, "#0f2f42");

  // 陸地
  ctx.save();
  land.forEach(f => fill(f, "#e7ddc7"));
  ctx.restore();

  // 時區填色
  const mode = ui.tzmode.value;
  const zones = mode === "ideal" ? idealZones : (mode === "real" ? tz : []);
  zones.forEach(f => fill(f, zoneColor(f.properties.v, 0.30)));
  if(zones.length){
    zones.forEach(f => stroke(f, "rgba(255,255,255,.16)", 0.7));
  }
  if(picked && picked.zone){
    const hit = zones.find(f => f === picked.zone);
    if(hit){ fill(hit, zoneColor(hit.properties.v, 0.5)); stroke(hit, "rgba(255,240,210,.8)", 1.2); }
  }

  // 國界
  if(ui.borders.checked) co.forEach(f => stroke(f, "rgba(40,60,72,.55)", 0.7));

  // 經緯線
  const step = +ui.grid.value;
  if(step){
    stroke(graticule.step([step,step])(), "rgba(216,169,79,.26)", 0.6);
    const special = [
      {lat:0,     c:"rgba(232,196,120,.85)", w:1.4, dash:[]},
      {lat:23.44, c:"rgba(216,169,79,.6)",  w:1,   dash:[5,4]},
      {lat:-23.44,c:"rgba(216,169,79,.6)",  w:1,   dash:[5,4]},
      {lat:66.56, c:"rgba(150,200,220,.5)", w:1,   dash:[2,4]},
      {lat:-66.56,c:"rgba(150,200,220,.5)", w:1,   dash:[2,4]}
    ];
    special.forEach(s => stroke(
      {type:"LineString", coordinates:d3.range(-180,181,3).map(l=>[l,s.lat])},
      s.c, s.w, s.dash));
    // 本初子午線與換日線
    [0,180].forEach(l => stroke(
      {type:"LineString", coordinates:d3.range(-90,91,3).map(la=>[l,la])},
      l===0 ? "rgba(232,196,120,.8)" : "rgba(150,200,220,.6)", 1.1, l===0?[]:[4,4]));
  }

  // 晝夜
  if(ui.night.checked){
    const sun = subsolar(currentDate());
    const anti = [sun[0]>0 ? sun[0]-180 : sun[0]+180, -sun[1]];
    fill(d3.geoCircle().center(anti).radius(90)(), "rgba(3,10,18,.52)");
    stroke(d3.geoCircle().center(anti).radius(90)(), "rgba(255,214,150,.35)", 1);
    if(isVisible(sun)){
      const p = projection(sun);
      ctx.beginPath(); ctx.arc(p[0],p[1],4,0,2*Math.PI);
      ctx.fillStyle = "rgba(255,226,160,.95)"; ctx.fill();
    }
  }

  // 球緣
  stroke({type:"Sphere"}, "rgba(216,169,79,.55)", 1.2);

  // 標籤
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if(step && ui.gridlab.checked) drawGridLabels(step);
  if(ui.climate.checked) drawClimateLabels();
  if(zones.length && ui.tzlab.checked) drawZoneLabels(zones);
  if(ui.citymark.checked) drawCityMarks();
  drawPin();
  updateReadout();
}

function label(text, point, color, size){
  if(!isVisible(point)) return;
  const p = projection(point);
  ctx.font = (size||11) + 'px Georgia, "Songti TC", serif';
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(4,12,18,.85)";
  ctx.strokeText(text, p[0], p[1]);
  ctx.fillStyle = color; ctx.fillText(text, p[0], p[1]);
}
function drawGridLabels(step){
  // 經度：沿赤道排一圈
  const sLon = step < 15 ? 30 : (step === 15 ? 30 : step);
  for(let lon=-180; lon<180; lon+=sLon){
    const t = lon===0 ? "0°" : Math.abs(lon)+"°"+(lon>0?"E":"W");
    label(t, [lon, 2], "rgba(240,214,160,.95)");
  }
  // 緯度：沿著「正對鏡頭的那條經線」排，格線多密就標多密（上限 15° 一格，免得擠）
  const sLat = step < 10 ? 10 : (step > 30 ? 30 : step);
  const centerLon = -rot[0];
  for(let lat=-80; lat<=80; lat+=sLat){
    if(lat===0) continue;                       // 0° 交給氣候帶那層去標「赤道」
    if(Math.abs(lat) > 80) continue;
    label(Math.abs(lat)+"°"+(lat>0?"N":"S"), [centerLon+3, lat], "rgba(240,214,160,.82)", 10.5);
  }
}

// 氣候帶：把課本 1-3 的那幾條界線標出名字（p.15）
function drawClimateLabels(){
  const centerLon = -rot[0];
  CLIMATE_LINES.forEach(([lat, name]) => {
    const col = lat === 0 ? "rgba(255,232,178,.97)"
              : (Math.abs(lat) < 40 ? "rgba(240,206,132,.95)" : "rgba(176,216,235,.95)");
    label(name, [centerLon - 46, lat], col, 12);
  });
  CLIMATE_BANDS.forEach(([lat, name]) => {
    label(name, [centerLon + 52, lat], "rgba(255,255,255,.42)", 12);
  });
}

// 城市地標：小圓點＋名稱，只畫看得見的那一面
function drawCityMarks(){
  CITY_PTS.forEach(([name, lon, lat]) => {
    const pt = [lon, lat];
    if(!isVisible(pt)) return;
    const p = projection(pt);
    ctx.beginPath(); ctx.arc(p[0], p[1], 2.6, 0, 2*Math.PI);
    ctx.fillStyle = "rgba(255,238,190,.95)"; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(60,40,20,.75)"; ctx.stroke();
    ctx.textAlign = "left";
    ctx.font = '11.5px Georgia, "Songti TC", serif';
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(4,12,18,.9)";
    ctx.strokeText(name, p[0] + 6, p[1] - 5);
    ctx.fillStyle = "rgba(255,244,214,.97)";
    ctx.fillText(name, p[0] + 6, p[1] - 5);
    ctx.textAlign = "center";
  });
}
function drawZoneLabels(zones){
  zones.forEach(f=>{
    if(f.properties.a < 0.004) return;
    const c = f.properties.c;
    if(!isVisible(c)) return;
    const z = f.properties.v;
    const s = z<0 ? "−" : "+";
    label(s + (Math.abs(z)%1 ? Math.abs(z).toFixed(2).replace(/0$/,"") : Math.abs(z)),
          c, "rgba(255,255,255,.9)", 11.5);
  });
}
function drawPin(){
  if(!picked || !isVisible(picked.coord)) return;
  const p = projection(picked.coord);
  ctx.beginPath(); ctx.arc(p[0],p[1],5,0,2*Math.PI);
  ctx.strokeStyle = "#ffd88a"; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(p[0],p[1],1.6,0,2*Math.PI);
  ctx.fillStyle = "#ffd88a"; ctx.fill();
}

/* ---------- 文字資訊 ---------- */
function fmtCoord(c){
  const lon=c[0], lat=c[1];
  const f=(v,pos,neg)=>Math.abs(v).toFixed(1)+"° "+(v>=0?pos:neg);
  return f(lat,"N","S") + "，" + f(lon,"E","W");
}
function updateReadout(){
  document.getElementById("readout").textContent =
    "中心 " + fmtCoord(centerPoint()) + "　放大 " + zoom.toFixed(1) + "×";
  const d = currentDate();
  const utc = d.toISOString().slice(11,16);
  const tpe = new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
  document.getElementById("clock").innerHTML =
    "UTC <b>" + utc + "</b>　台北 <b>" + tpe + "</b>" + (manualTime===null ? "" : "（模擬時刻）");
}
function zoneAt(coord){
  const mode = ui.tzmode.value;
  const list = mode === "ideal" ? idealZones : tz;
  if(mode === "off") return null;
  return list.find(f => d3.geoContains(f, coord)) || null;
}
function setPick(coord){
  const zone = zoneAt(coord);
  picked = {coord, zone};
  const el = document.getElementById("pin");
  if(!zone){
    el.innerHTML = '<span class="big">' + fmtCoord(coord) + '</span>此處無時區資料（多為公海或未定區）';
  }else{
    const z = zone.properties.v;
    const d = currentDate();
    const t = new Date(d.getTime() + z*3600000);
    const hhmm = t.toISOString().slice(11,16);
    el.innerHTML = '<span class="big">' + fmtCoord(coord) + '</span>' +
      '<span class="zone">' + offsetText(z) + '</span>　當地標準時間 ' + hhmm;
  }
}

/* ---------- 城市時鐘 ---------- */
const CITIES = [
  ["台北","Asia/Taipei"],["東京","Asia/Tokyo"],["新加坡","Asia/Singapore"],
  ["杜拜","Asia/Dubai"],["倫敦","Europe/London"],["紐約","America/New_York"],
  ["洛杉磯","America/Los_Angeles"],["雪梨","Australia/Sydney"]
];

// 畫在地球上的地標（名稱, 經度, 緯度）。挑選原則：
// 五大洲都有、且刻意放進幾個「剛好座落在特殊緯線上」的點，
// 讓學生看見回歸線與赤道不是抽象的線。
const CITY_PTS = [
  ["台北", 121.5, 25.0], ["嘉義", 120.4, 23.5], ["東京", 139.7, 35.7],
  ["北京", 116.4, 39.9], ["新加坡", 103.8, 1.4], ["杜拜", 55.3, 25.3],
  ["莫斯科", 37.6, 55.8], ["倫敦", -0.1, 51.5], ["開羅", 31.2, 30.0],
  ["奈洛比", 36.8, -1.3], ["好望角", 18.5, -34.4], ["紐約", -74.0, 40.7],
  ["洛杉磯", -118.2, 34.1], ["里約", -43.2, -22.9], ["雪梨", 151.2, -33.9]
];

// 氣候帶界線（緯度, 名稱）。23.44 與 66.56 是課本的 23.5°、66.5°。
const CLIMATE_LINES = [
  [  0,     "赤道 0°"],
  [ 23.44,  "北回歸線 23.5°N"],
  [-23.44,  "南回歸線 23.5°S"],
  [ 66.56,  "北極圈 66.5°N"],
  [-66.56,  "南極圈 66.5°S"]
];
// 三大氣候帶（標在中間緯度）
const CLIMATE_BANDS = [
  [ 12,  "熱　帶"], [-12,  "熱　帶"],
  [ 45,  "溫　帶"], [-45,  "溫　帶"],
  [ 78,  "寒　帶"], [-78,  "寒　帶"]

];
function drawCities(){
  const d = currentDate();
  document.getElementById("cities").innerHTML = CITIES.map(([name,tzid])=>{
    const t = new Intl.DateTimeFormat("zh-TW",{timeZone:tzid,hour:"2-digit",minute:"2-digit",hour12:false}).format(d);
    const off = new Intl.DateTimeFormat("en",{timeZone:tzid,timeZoneName:"shortOffset"})
      .formatToParts(d).find(p=>p.type==="timeZoneName").value.replace("GMT","UTC");
    return `<tr><td>${name}</td><td class="o">${off}</td><td class="t">${t}</td></tr>`;
  }).join("");
}

/* ---------- 互動 ---------- */
let dragging=false, moved=0, last=null, pointers=new Map(), pinchDist=0;

canvas.addEventListener("pointerdown", e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,[e.offsetX,e.offsetY]);
  if(pointers.size===1){ dragging=true; moved=0; last=[e.offsetX,e.offsetY]; }
  if(pointers.size===2){ const v=[...pointers.values()]; pinchDist=Math.hypot(v[0][0]-v[1][0], v[0][1]-v[1][1]); }
});
canvas.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,[e.offsetX,e.offsetY]);
  if(pointers.size===2){
    const v=[...pointers.values()];
    const d=Math.hypot(v[0][0]-v[1][0], v[0][1]-v[1][1]);
    if(pinchDist){ zoom = Math.max(0.7, Math.min(8, zoom * d/pinchDist)); }
    pinchDist=d; draw(); return;
  }
  if(!dragging) return;
  const k = 72 / (baseScale*zoom);
  const dx = e.offsetX-last[0], dy = e.offsetY-last[1];
  moved += Math.abs(dx)+Math.abs(dy);
  rot[0] += dx*k*1.6;
  rot[1] = Math.max(-90, Math.min(90, rot[1] - dy*k*1.6));
  last=[e.offsetX,e.offsetY];
  draw();
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinchDist=0;
  if(pointers.size===0){
    if(dragging && moved<4){
      const c = projection.invert([e.offsetX,e.offsetY]);
      if(c && !isNaN(c[0]) && d3.geoDistance(c, centerPoint()) < Math.PI/2){ setPick(c); draw(); }
    }
    dragging=false;
  }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("wheel", e=>{
  e.preventDefault();
  zoom = Math.max(0.7, Math.min(8, zoom * (e.deltaY>0 ? 0.92 : 1.08)));
  draw();
}, {passive:false});
canvas.addEventListener("keydown", e=>{
  const s = e.shiftKey ? 1 : 6;
  if(e.key==="ArrowLeft") rot[0]-=s;
  else if(e.key==="ArrowRight") rot[0]+=s;
  else if(e.key==="ArrowUp") rot[1]=Math.min(90,rot[1]+s);
  else if(e.key==="ArrowDown") rot[1]=Math.max(-90,rot[1]-s);
  else if(e.key==="+"||e.key==="=") zoom=Math.min(8,zoom*1.1);
  else if(e.key==="-") zoom=Math.max(0.7,zoom/1.1);
  else return;
  e.preventDefault(); draw();
});

Object.values(ui).forEach(el => el.addEventListener("input", ()=>{
  if(el===ui.hour){ manualTime = +ui.hour.value; updateHourLabel(); drawCities(); }
  draw();
}));
function updateHourLabel(){
  const el = document.getElementById("hourlab");
  if(manualTime===null){ el.textContent = "跟著現在時間走"; return; }
  const h = String(Math.floor(manualTime/60)).padStart(2,"0");
  const m = String(manualTime%60).padStart(2,"0");
  el.textContent = "模擬 UTC " + h + ":" + m + "，晝夜線隨之移動";
}
document.getElementById("nowbtn").addEventListener("click", ()=>{
  manualTime = null; updateHourLabel(); drawCities(); draw();
});
document.getElementById("reset").addEventListener("click", ()=>{
  rot=[0,0]; zoom=1; draw();
});
document.getElementById("taipei").addEventListener("click", ()=>{
  flyTo([121.56,25.03]); setPick([121.56,25.03]);
});
function flyTo(c){
  const from=[rot[0],rot[1]], to=[-c[0],-c[1]];
  if(from[0]-to[0] > 180) to[0]+=360; if(to[0]-from[0] > 180) to[0]-=360;
  const t0=performance.now(), dur=reduceMotion?0:800;
  (function step(now){
    const u = dur? Math.min(1,(now-t0)/dur) : 1;
    const e = u<0.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;
    rot=[from[0]+(to[0]-from[0])*e, from[1]+(to[1]-from[1])*e];
    draw();
    if(u<1) requestAnimationFrame(step);
  })(performance.now());
}

/* ---------- 自動旋轉 ---------- */
let prev = performance.now();
function tick(now){
  const dt = Math.min(0.1,(now-prev)/1000); prev = now;
  if(ui.spin.checked && !dragging){
    rot[0] += (+ui.speed.value) * dt * (+ui.dir.value);
    if(rot[0] > 180) rot[0] -= 360; if(rot[0] < -180) rot[0] += 360;
    draw();
  }
  requestAnimationFrame(tick);
}
setInterval(()=>{ if(manualTime===null){ drawCities(); if(!ui.spin.checked) draw(); } }, 1000);

resize(); drawCities(); updateHourLabel(); requestAnimationFrame(tick);
</script>
